workflows:
  ligama-ios-build:
    name: Build LIGAMA iOS App
    environment:
      vars:
        XCODE_WORKSPACE: "Ligama.xcworkspace" # si tu n'as pas de workspace, mets .xcodeproj
        XCODE_SCHEME: "Ligama"
        BUNDLE_ID: "app.ligama.ligama"
      xcode: latest
      cocoapods: default
      flutter: false
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Install CocoaPods dependencies
        script: |
          pod install
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace="$XCODE_WORKSPACE" \
            --scheme="$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
