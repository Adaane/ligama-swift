workflows:
  ligama-ios:
    name: LIGAMA iOS Build
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "Ligama.xcworkspace"
        XCODE_SCHEME: "Ligama"
        BUNDLE_ID: "app.ligama.ligama" # modifie si nécessaire
    integrations:
      app_store_connect: true
    scripts:
      - name: Install CocoaPods
        script: |
          pod install

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace="$XCODE_WORKSPACE" \
            --scheme="$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
